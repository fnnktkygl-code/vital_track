name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Security gate (no hardcoded AIza key)
        run: |
          set -euo pipefail
          if grep -R -n -E 'AIza[0-9A-Za-z_-]{20,}' docs/app docs/index.html docs/privacy.html --exclude='*.apk'; then
            echo "❌ Hardcoded Google API key pattern detected in docs artifact."
            exit 1
          fi
          echo "✅ Docs artifact passed key scan."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
