<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="vitalHeadGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C5CFE2"/>
      <stop offset="60%" stop-color="#8A95AC"/>
      <stop offset="100%" stop-color="#505970"/>
    </radialGradient>
    <linearGradient id="vitalIridGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="vitalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="28" fill="#0F172A"/>
  
  <!-- Vital Head Group with Shadow -->
  <g filter="url(#vitalShadow)">
    <!-- Iridescent Neck -->
    <path d="M 26 84 Q 50 68 74 84 Q 50 96 26 84 Z" fill="url(#vitalIridGrad)"/>
    <!-- Head Base -->
    <ellipse cx="50" cy="46" rx="28" ry="30" fill="url(#vitalHeadGrad)"/>
    <!-- Concentric Orange Eyes -->
    <circle cx="38" cy="42" r="9" fill="#FB923C"/>
    <circle cx="38" cy="42" r="6" fill="#EA580C"/>
    <circle cx="38" cy="42" r="3.5" fill="#141416"/>
    <circle cx="36.5" cy="40.5" r="1.3" fill="#FFFFFF"/>
    
    <circle cx="62" cy="42" r="9" fill="#FB923C"/>
    <circle cx="62" cy="42" r="6" fill="#EA580C"/>
    <circle cx="62" cy="42" r="3.5" fill="#141416"/>
    <circle cx="60.5" cy="40.5" r="1.3" fill="#FFFFFF"/>
    
    <!-- Cere & Beak -->
    <ellipse cx="50" cy="52" rx="6.5" ry="3.5" fill="#F5F2EB"/>
    <path d="M 44 54 Q 50 65 56 54 Z" fill="#353942"/>
    <path d="M 45 54 Q 50 63 55 54 Z" fill="#1E2128"/>
  </g>
</svg>
